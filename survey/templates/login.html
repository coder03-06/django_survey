
{% extends 'base.html' %}

{% block content %}

<h2>Login</h2>

<p>Login to view survey results.</p>

{% if form.errors %}
    <p style="color:red;">
        Invalid username or password.
    </p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <input type="hidden"
           name="next"
           value="{{ next }}">

    <button type="submit">Login</button>

</form>

{% endblock %}
