
<!DOCTYPE html>
<html>
<head>
    <title>Django Survey App</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
        }

        nav {
            background: #243b67;
            padding: 18px;
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #243b67;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-form {
            display: inline;
        }

        .logout-form button {
            background: transparent;
            padding: 0;
            font: inherit;
            text-decoration: underline;
        }

        .success {
            color: green;
            padding: 10px;
        }

        .errorlist {
            color: red;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #e8edf6;
        }

        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}">Home</a>

    {% if user.is_authenticated %}

        <a href="{% url 'results' %}">
            Survey Results
        </a>

        <form method="post"
              action="{% url 'logout' %}"
              class="logout-form">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>

    {% else %}

        <a href="{% url 'login' %}">Login</a>

    {% endif %}
</nav>

<div class="container">

    {% for message in messages %}
        <p class="success">{{ message }}</p>
    {% endfor %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
